[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pingmesh-propagation-labeler"
version = "2.2.0"
description = "Dependency-free local UI for DD/EE heterogeneous Pingmesh propagation graph annotation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
propagation-labeler = "propagation_labeler.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
propagation_labeler = ["propagation_labeler_ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
